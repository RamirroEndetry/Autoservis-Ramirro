name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application
        run: |
          node --check js/app.js
          node --check js/pdf.js
          node --check js/cloud.js
          node tests/sync-model.cjs
          node tests/catalogue.cjs
          node tests/ford-catalogue.cjs
          node tests/engine-catalogue.cjs
          node tests/tax-import.cjs
          node tests/payment.cjs
          node tests/clients-settlement.cjs
      - name: Build public files only
        run: node scripts/build-site.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
